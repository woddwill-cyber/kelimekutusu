<script>

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// SABİT ORTAK DEPO (Şifresiz, tek sana özel)
const userCode = "yusuf_ortak_depo"; 

// Buluta Veri Yazma Fonksiyonu
function updateCloudStats(en, success) {
  const docRef = db.collection('userStats').doc(userCode).collection('words').doc(en);
  
  db.runTransaction(transaction => {
    return transaction.get(docRef).then(doc => {
      let dogru = 0, yanlis = 0;
      if (doc.exists) {
        dogru = doc.data().dogru || 0;
        yanlis = doc.data().yanlis || 0;
      }
      if (success) dogru++; else yanlis++;
      transaction.set(docRef, { en: en, dogru: dogru, yanlis: yanlis }, {merge: true});
    });
  }).catch(err => console.log("Bulut kaydı hatası:", err));
}

// ============ SM-2 ARALIKLI TEKRAR (SPACED REPETITION) ============
// SM-2 algoritmasının klasik tanımına göre: her tekrarda kullanıcı 0-5 arası
// bir "kalite" puanı verir (0-2: unutuldu, 3: zor ama hatırlandı, 4: iyi, 5: kolay).
// Bu puana göre bir sonraki tekrar aralığı (interval) ve kolaylık faktörü (ease factor)
// yeniden hesaplanır ve kelimenin bir sonraki gösterim tarihi (due) belirlenir.
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(dateStr, n){
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d); // yerel tarih bileşenleriyle oluştur, saat dilimi kaymasını önler
  dt.setDate(dt.getDate() + n);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

function sm2Next(card, quality){
  // card: { reps, ef, interval } — yoksa varsayılan değerler kullanılır
  let reps = card.reps || 0;
  let ef = card.ef || 2.5;
  let interval = card.interval || 0;

  if(quality < 3){
    reps = 0;
    interval = 1;
  } else {
    if(reps === 0) interval = 1;
    else if(reps === 1) interval = 6;
    else interval = Math.round(interval * ef);
    reps += 1;
  }

  ef = ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  if(ef < 1.3) ef = 1.3;

  return { reps, ef: Math.round(ef*100)/100, interval, due: addDays(todayStr(), interval), last: todayStr() };
}

// Bulut yazması tamamlanmadan aynı oturumda tekrar okuma yapılırsa (ör. "Listeyi Yenile"ye
// hemen basmak) eski veri gelmesin diye, en son yazılan sm2 değerlerini burada da tutuyoruz.
let srsLocalCache = {};

// Bir kelimenin SM-2 durumunu buluta kaydeder
async function saveSm2(en, sm2){
  srsLocalCache[en] = { ...(srsLocalCache[en]||{}), en, sm2 };
  const docRef = db.collection('userStats').doc(userCode).collection('words').doc(en);
  try{ await docRef.set({ en, sm2 }, { merge: true }); }
  catch(err){ console.log('SM-2 kayıt hatası:', err); }
}

// Tüm kelimelerin buluttaki durumunu (dogru/yanlis + sm2) çeker.
// Henüz buluta yazılmamış olabilecek en güncel değerleri yerel önbellekten üzerine yazar.
async function fetchAllWordStats(){
  const snapshot = await db.collection('userStats').doc(userCode).collection('words').get();
  const map = {};
  snapshot.forEach(doc => { map[doc.id] = doc.data(); });
  Object.keys(srsLocalCache).forEach(en => {
    map[en] = { ...(map[en]||{}), ...srsLocalCache[en] };
  });
  return map;
}

// ============ SERİ (STREAK) & GENEL İSTATİSTİK TAKİBİ ============
let userStats = { streak:0, longestStreak:0, lastActiveDate:null, totalReviews:0, totalCorrect:0, totalWrong:0 };
let userStatsLoaded = false;

async function loadUserStats(){
  try{
    const doc = await db.collection('userStats').doc(userCode).get();
    if(doc.exists){
      const d = doc.data();
      userStats = {
        streak: d.streak || 0,
        longestStreak: d.longestStreak || 0,
        lastActiveDate: d.lastActiveDate || null,
        totalReviews: d.totalReviews || 0,
        totalCorrect: d.totalCorrect || 0,
        totalWrong: d.totalWrong || 0,
      };
    }
    // Bir günden fazla ara verilmişse seriyi kır (bugün ve dün dışında bir tarihse)
    const today = todayStr();
    const yesterday = addDays(today, -1);
    if(userStats.lastActiveDate && userStats.lastActiveDate !== today && userStats.lastActiveDate !== yesterday){
      userStats.streak = 0;
    }
  } catch(err){
    console.log('İstatistik yüklenemedi:', err);
  }
  userStatsLoaded = true;
  renderStreakBadge();
}

function saveUserStats(){
  db.collection('userStats').doc(userCode).set(userStats, { merge: true }).catch(err => console.log('İstatistik kayıt hatası:', err));
}

// Her doğru/yanlış cevapta çağrılır: günlük seriyi ve toplam sayaçları günceller
function registerActivity(success){
  userStats.totalReviews++;
  if(success) userStats.totalCorrect++; else userStats.totalWrong++;

  const today = todayStr();
  if(userStats.lastActiveDate !== today){
    const yesterday = addDays(today, -1);
    userStats.streak = (userStats.lastActiveDate === yesterday) ? userStats.streak + 1 : 1;
    userStats.lastActiveDate = today;
    if(userStats.streak > userStats.longestStreak) userStats.longestStreak = userStats.streak;
  }
  saveUserStats();
  renderStreakBadge();
}

function renderStreakBadge(){
  const el = document.getElementById('streakBadge');
  if(!el) return;
  if(!userStatsLoaded){ el.textContent = '🔥 …'; return; }
  el.textContent = userStats.streak > 0 ? `🔥 ${userStats.streak} günlük seri` : '🔥 Bugün pratik yap, seriyi başlat!';
}

let WORDS = [];
const LIMIT = 30;
let mastery = {};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function selectNewSet() {
  const karisik = shuffle([...ALL_WORDS]);
  WORDS = karisik.slice(0, Math.min(LIMIT, ALL_WORDS.length));
  document.getElementById('eyebrowLabel').textContent = WORDS.length + ' kart · sözcük çekmecesi';
  document.getElementById('subLabel').textContent = 'Kartları çevir, eşleştir, sına — ' + WORDS.length + ' kelimeyi kalıcı hafızaya yerleştir.';

  mastery = {};
  WORDS.forEach(w => mastery[w.en] = 'new');

  storyState = { text:null, title:null, loading:false, error:null, usedWords:[] };
  srsState = null;
  typeState = null;

  renderProgress();
  const aktifTab = document.querySelector('nav.tabs button.active');
  if(aktifTab) render(aktifTab.dataset.tab);
}

function bumpMastery(en, success){
  const cur = mastery[en];
  if(success){
    mastery[en] = (cur === 'learning') ? 'known' : 'learning';
  } else {
    if(cur !== 'known') mastery[en] = 'learning';
  }
  updateCloudStats(en, success); // BULUTA YAZ
  registerActivity(success); // SERİ VE İSTATİSTİK GÜNCELLE
  renderProgress();
}

function renderProgress(){
  const rail = document.getElementById('progressRail');
  rail.innerHTML = '';
  WORDS.forEach(w=>{
    const d = document.createElement('div');
    d.className = 'dot ' + (mastery[w.en] === 'known' ? 'known' : mastery[w.en] === 'learning' ? 'learning' : '');
    d.title = w.en;
    rail.appendChild(d);
  });
}

const panel = document.getElementById('panel');
const tabsNav = document.getElementById('tabs');
tabsNav.addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  [...tabsNav.children].forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render(btn.dataset.tab);
});

function render(tab){
  if(tab === 'story') renderStory();
  else if(tab === 'srs') renderSrs();
  else if(tab === 'type') renderType();
  else if(tab === 'hard') renderHardWords(); // YENİ BULUT SEKME
  else if(tab === 'focusedType') renderFocusedType();
  else if(tab === 'stats') renderStats();
}

// --- YENİ ZORLU KELİMELER SEKME MANTIĞI ---
async function renderHardWords() {
  panel.innerHTML = `
    <div class="fc-pos">BULUTTAN VERİLER ÇEKİLİYOR...</div>
    <div style="text-align:center; padding:20px; font-size:24px;">⏳</div>
  `;
  try {
    const snapshot = await db.collection('userStats').doc(userCode).collection('words').get();
    let stats = [];
    snapshot.forEach(doc => {
      let data = doc.data();
      let wordObj = ALL_WORDS.find(w => w.en === data.en);
      if(wordObj && data.yanlis > 0) {
        stats.push({ ...wordObj, dogru: data.dogru, yanlis: data.yanlis });
      }
    });
    
    stats.sort((a,b) => b.yanlis - a.yanlis); // En çok yanlış yapılanlar en üste
    
    let html = `
      <div class="fc-pos">EN ÇOK ZORLANDIĞIN KELİMELER (BULUT KAYDI)</div>
      <div style="text-align:center; margin-bottom: 20px;">
        <button class="btn" style="border-color:var(--stamp); color:var(--stamp-dark);" onclick="resetCloudStats()">🗑️ Tüm Geçmişi Sıfırla</button>
      </div>
    `;

    if(stats.length === 0) {
      html += `<div class="fc-example" style="margin-top:20px;">Henüz hiç yanlış yapmadın! Eşleştirme veya Quiz oynayarak hafızayı doldur. 🎉</div>`;
    } else {
      stats.forEach(s => {
        html += `
          <div class="review-row" style="background:#fff; border-color:var(--kraft-light)">
            <div class="review-en">${s.en}</div>
            <div class="review-tr">${s.tr}</div>
            <div class="stat-wrong">Yanlış: ${s.yanlis}</div>
            <div class="stat-correct">Doğru: ${s.dogru}</div>
          </div>
        `;
      });
    }
    panel.innerHTML = html;
  } catch (error) {
    panel.innerHTML = `<div class="fc-pos" style="color:var(--stamp-dark)">HATA OLUŞTU</div><div class="fc-example">Veriler çekilemedi. İnternet bağlantını kontrol et.</div>`;
  }
}

  if(!confirm("Tüm hata geçmişini tamamen sıfırlamak istediğine emin misin? Bu işlem geri alınamaz!")) return;

  panel.innerHTML = `
    <div class="fc-pos">GEÇMİŞ SİLİNİYOR... Lütfen bekle.</div>
    <div style="text-align:center; padding:20px; font-size:24px;">⏳</div>

}
// ================= İSTATİSTİK PANELİ =================
async function renderStats(){
  panel.innerHTML = `<div class="srs-empty"><div class="fc-pos">İSTATİSTİKLER YÜKLENİYOR…</div><div style="font-size:24px;margin-top:14px;">⏳</div></div>`;
  let allStats = {};
  try{ allStats = await fetchAllWordStats(); }
  catch(err){ /* buluta erişilemezse yine de genel serileri gösterebiliriz */ }

  const today = todayStr();
  let known = 0, learning = 0, seen = 0, dueToday = 0;
  ALL_WORDS.forEach(w=>{
    const s = allStats[w.en];
    if(!s){ return; }
    seen++;
    const sm2 = s.sm2;
    if(sm2){
      if(sm2.reps >= 2) known++; else learning++;
      if(sm2.due && sm2.due <= today) dueToday++;
    } else if((s.dogru||0) > 0){
      learning++;
    }
  });
  const untouched = Math.max(ALL_WORDS.length - seen, 0);

  const totalAnswered = userStats.totalCorrect + userStats.totalWrong;
  const accuracy = totalAnswered > 0 ? Math.round((userStats.totalCorrect / totalAnswered) * 100) : 0;

  const pct = (n)=> ALL_WORDS.length ? Math.round((n/ALL_WORDS.length)*100) : 0;

  panel.innerHTML = `
    <div class="fc-pos" style="margin-bottom:14px;">SERİ & MOTİVASYON</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">🔥 ${userStats.streak}</div><div class="stat-label">Günlük Seri</div></div>
      <div class="stat-card"><div class="stat-num">🏆 ${userStats.longestStreak}</div><div class="stat-label">En Uzun Seri</div></div>
      <div class="stat-card"><div class="stat-num">${userStats.totalReviews}</div><div class="stat-label">Toplam Tekrar</div></div>
      <div class="stat-card"><div class="stat-num">%${accuracy}</div><div class="stat-label">Doğruluk Oranı</div></div>
    </div>

    <div class="fc-pos" style="margin-bottom:10px;">KELİME HAVUZU (${ALL_WORDS.length} kelime)</div>
    <div class="mastery-bar-wrap">
      <div style="width:${pct(known)}%; background:var(--sage);"></div>
      <div style="width:${pct(learning)}%; background:var(--kraft-light);"></div>
      <div style="width:${pct(untouched)}%; background:var(--paper);"></div>
    </div>
    <div class="mastery-legend">
      <span><i class="legend-dot" style="background:var(--sage);"></i>Öğrenildi: ${known}</span>
      <span><i class="legend-dot" style="background:var(--kraft-light);"></i>Öğreniliyor: ${learning}</span>
      <span><i class="legend-dot" style="background:var(--paper); border:1px solid var(--kraft-light);"></i>Hiç görülmedi: ${untouched}</span>
    </div>

    <div class="fc-example" style="text-align:center; margin-top:10px;">
      ${dueToday > 0 ? `Bugün <b>${dueToday}</b> kelimenin tekrar zamanı geldi — "Tekrar" sekmesinden pratik yapabilirsin.` : 'Bugün için bekleyen bir tekrar yok, harika gidiyorsun! 🎉'}
    </div>
  `;
}

// ================= STORY =================
let storyState = { text:null, title:null, loading:false, error:null, usedWords:[] };

const STORY_SETTINGS = [ "a small coastal fishing town","a busy hospital ward at night","a quiet mountain village","an old university library","a rainy city office" ];
const STORY_CHARACTERS = [ "a nervous young teacher","two arguing siblings","a retired sailor","a shy new student","a tired night-shift nurse" ];

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function highlightStory(text){
  const sorted = WORDS.slice().sort((a,b)=> b.en.length - a.en.length);
  const alternation = sorted.map(w => w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  const regex = new RegExp('\\b(' + alternation + ')[a-zA-Z]*\\b', 'gi');
  const used = new Set();
  const escaped = escapeHtml(text);
  const highlighted = escaped.replace(regex, (match) => {
    const lower = match.toLowerCase();
    const w = sorted.find(x => lower.startsWith(x.en.toLowerCase()));
    if(!w) return match;
    used.add(w.en);
    return `<span class="story-word" title="${w.tr} · ${w.pos}">${match}</span>`;
  });
  return { html: highlighted, used: [...used] };
}

async function generateStory(){
  storyState.loading = true;
  storyState.error = null;
  renderStory();

  const setting = pick(STORY_SETTINGS);
  const character = pick(STORY_CHARACTERS);
  const wordList = WORDS.map(w=>w.en).join(', ');

  const prompt = `Write a short, engaging, ORIGINAL English story at CEFR B1 level (roughly 180-260 words).
Setting inspiration: ${setting}. Main character(s) inspiration: ${character}. Feel free to adapt these loosely.
Naturally use as many of the following words as possible (any grammatical form: plural, past tense, -ing, adverb form, etc. are all fine): ${wordList}.
Do not force every single word in if it breaks natural flow, but try hard to include most of them.
Write plain prose only: no markdown, no bullet points, no asterisks, no word list, no explanation.
First line: a short title (no more than 6 words). Then a blank line. Then the story itself, in 2-4 paragraphs.`;

  const geminiApiKey = "BURAYA_YENI_GEMINI_ANAHTARINI_YAZIN"; // Google AI Studio'dan aldığın anahtarı buraya gir!
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`;

  try{
    const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error?.message || 'API Hatası');

    const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    if(!raw) throw new Error('empty');

    const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length);
    const title = lines[0];
    const body = lines.slice(1).join('\n\n');

    const { html, used } = highlightStory(body);
    storyState = { text: html, title, loading:false, error:null, usedWords: used };
  } catch(err){
    storyState = { text:null, title:null, loading:false, error:'Hikaye oluşturulamadı: ' + err.message, usedWords:[] };
  }
  renderStory();
}

function renderStory(){
  if(storyState.loading){
    panel.innerHTML = `<div class="story-empty"><div class="fc-pos">HİKAYE YAZILIYOR</div><div class="fc-word" style="font-size:22px;">Kelimelerin geçtiği eşsiz bir B1 hikaye hazırlanıyor…</div></div>`;
    return;
  }
  if(storyState.error){
    panel.innerHTML = `<div class="story-empty"><div class="fc-pos" style="color:var(--stamp-dark);">HATA</div><div class="fc-example">${storyState.error}</div><div class="fc-controls" style="margin-top:18px;"><button class="btn primary" id="storyGen">Tekrar Dene</button></div></div>`;
    document.getElementById('storyGen').onclick = generateStory;
    return;
  }
  if(!storyState.text){
    panel.innerHTML = `<div class="story-empty"><div class="fc-pos">HER TIKLAMADA YENİ BİR HİKAYE</div><div class="fc-word" style="font-size:24px;">Kelime listesini kullanan bir B1 hikayesi okumaya hazır mısın?</div><div class="fc-example" style="margin-top:6px;">Hikayede geçen ${WORDS.length} kelimeden biri, altı çizili olarak vurgulanır — üzerine gelince Türkçesini görürsün.</div><div class="fc-controls" style="margin-top:20px;"><button class="btn primary" id="storyGen">Hikaye Oluştur</button></div></div>`;
    document.getElementById('storyGen').onclick = generateStory;
    return;
  }
  const usedCount = storyState.usedWords.length;
  panel.innerHTML = `
    <div class="story-meta"><span>KULLANILAN KELİME: ${usedCount} / ${WORDS.length}</span><button class="btn stamp" id="storyGen">Yeni Hikaye Oluştur</button></div>
    <div class="story-title">${storyState.title || ''}</div>
    <div class="story-body">${storyState.text.split('\n\n').map(p=>`<p>${p}</p>`).join('')}</div>
  `;
  document.getElementById('storyGen').onclick = generateStory;
}

// Sadece SM-2 zamanlama verisini sıfırlar (dogru/yanlis istatistiklerine dokunmaz).
// Yanlış hesaplanmış eski "due" tarihlerini temizlemek için kullanılır.
async function resetSrsSchedule(){
  if(!confirm('Tüm kelimelerin tekrar zamanlamasını sıfırlamak istediğine emin misin? Doğru/yanlış istatistiklerin korunacak, sadece "ne zaman tekrar edileceği" bilgisi silinecek.')) return;
  panel.innerHTML = `<div class="fc-pos">ZAMANLAMA SIFIRLANIYOR…</div><div style="text-align:center; padding:20px; font-size:24px;">⏳</div>`;
  try{
    const snapshot = await db.collection('userStats').doc(userCode).collection('words').get();
    const batch = db.batch();
    snapshot.forEach(doc=>{
      if(doc.data().sm2){
        batch.update(doc.ref, { sm2: firebase.firestore.FieldValue.delete() });
      }
    });
    await batch.commit();
    srsLocalCache = {};
    srsState = null;
    renderSrs();
  } catch(err){
    panel.innerHTML = `<div class="fc-pos" style="color:var(--stamp-dark)">HATA</div><div class="fc-example">Sıfırlama sırasında hata oluştu: ${err.message}</div>`;
  }
}

// ================= SRS (SM-2) TEKRAR MODU =================
let srsState = null; // { queue:[{word, cardData}], index, flipped, correctCount }
const SRS_NEW_LIMIT = 10; // günde en fazla bu kadar "hiç görülmemiş" kelime eklenir

async function newSrsRound(){
  panel.innerHTML = `<div class="srs-empty"><div class="fc-pos">TEKRAR LİSTESİ HAZIRLANIYOR…</div><div style="font-size:24px;margin-top:14px;">⏳</div></div>`;
  let allStats = {};
  try{ allStats = await fetchAllWordStats(); }
  catch(err){
    panel.innerHTML = `<div class="srs-empty"><div class="fc-pos" style="color:var(--stamp-dark)">HATA</div><div class="fc-example">Bulut verisi çekilemedi. İnternet bağlantını kontrol et.</div></div>`;
    return;
  }
  const today = todayStr();
  const due = [], fresh = [];
  ALL_WORDS.forEach(w=>{
    const s = allStats[w.en];
    const sm2 = s && s.sm2;
    if(sm2 && sm2.due){
      if(sm2.due <= today) due.push({ word: w, sm2 });
    } else {
      fresh.push({ word: w, sm2: null });
    }
  });
  const queue = shuffle(due).concat(shuffle(fresh).slice(0, SRS_NEW_LIMIT));
  srsState = { queue, index: 0, flipped: false, correctCount: 0, dueTotal: due.length, newTotal: Math.min(fresh.length, SRS_NEW_LIMIT) };
  renderSrs();
}

function renderSrs(){
  if(!srsState){ newSrsRound(); return; }
  if(srsState.index >= srsState.queue.length){
    panel.innerHTML = `<div class="quiz-end"><div class="fc-pos">TEKRAR TAMAMLANDI</div><div class="quiz-score">${srsState.correctCount} / ${srsState.queue.length}</div><div class="fc-example">${srsState.queue.length === 0 ? 'Bugün için tekrar edilecek kelime yok — harika gidiyorsun! 🎉' : 'Bir sonraki tekrarların, verdiğin cevaplara göre otomatik zamanlandı.'}</div><div class="fc-controls" style="margin-top:20px; gap:10px;"><button class="btn primary" id="srsAgain">Listeyi Yenile</button>${srsState.queue.length === 0 ? '<button class="btn" style="border-color:var(--kraft-light); color:var(--ink-soft);" onclick="resetSrsSchedule()">Zamanlama Yanlış Görünüyorsa Sıfırla</button>' : ''}</div></div>`;
    document.getElementById('srsAgain').onclick = ()=>{ srsState = null; renderSrs(); };
    return;
  }
  const item = srsState.queue[srsState.index];
  const w = item.word;
  panel.innerHTML = `
    <div class="srs-meta"><span>KART ${srsState.index+1} / ${srsState.queue.length}</span><span>BUGÜN: ${srsState.dueTotal} tekrar · ${srsState.newTotal} yeni</span></div>
    <div style="text-align:center; margin-bottom:10px;"><button class="btn" style="font-size:10px; padding:6px 10px; border-color:var(--kraft-light); color:var(--ink-soft);" onclick="resetSrsSchedule()">Zamanlamayı Sıfırla</button></div>
    <div class="srs-card">
      <div class="fc-pos">${w.pos}</div>
      <div class="srs-flip" id="srsFlip">
        <div class="fc-word">${w.en}</div>
        ${srsState.flipped ? `
          <div class="srs-back">
            <div class="srs-tr">${w.tr}</div>
            <div class="fc-example">${w.ex.replace('___', w.en)}</div>
          </div>
        ` : `<div class="srs-hint">Anlamı görmek için tıkla</div>`}
      </div>
      ${srsState.flipped ? `
        <div class="rate-row">
          <button class="rate-btn rate-forgot" data-q="1">Unuttum<span class="sub">tekrar bugün</span></button>
          <button class="rate-btn rate-hard" data-q="3">Zor<span class="sub">kısa aralık</span></button>
          <button class="rate-btn rate-good" data-q="4">İyi<span class="sub">normal aralık</span></button>
          <button class="rate-btn rate-easy" data-q="5">Kolay<span class="sub">uzun aralık</span></button>
        </div>
      ` : ''}
    </div>
  `;
  if(!srsState.flipped){
    document.getElementById('srsFlip').onclick = ()=>{ srsState.flipped = true; renderSrs(); };
  } else {
    document.querySelectorAll('.rate-btn').forEach(b=>{
      b.onclick = ()=> handleSrsRating(w, item.sm2, parseInt(b.dataset.q, 10));
    });
  }
}

async function handleSrsRating(w, prevSm2, quality){
  const next = sm2Next(prevSm2 || {}, quality);
  await saveSm2(w.en, next);
  const success = quality >= 3;
  if(success) srsState.correctCount++;
  bumpMastery(w.en, success); // ilerleme noktalarını ve seriyi de günceller
  srsState.index++;
  srsState.flipped = false;
  renderSrs();
}

// ================= TYPING =================
let typeState = null;

function newTypeRound(){
  const order = shuffle(WORDS);
  typeState = { order, index:0, correct:0, checked:false, wrong:[] };
}

function renderType(){
  if(!typeState) newTypeRound();
  if(typeState.index >= typeState.order.length){
    const wrongList = typeState.wrong.map(w => `<div class="review-row"><div class="review-en">${w.en}</div><div class="review-mid"><div class="review-tr">${w.tr}</div><div class="review-ex">${w.ex.replace('___', w.en)}</div></div><div class="review-given">${w.given ? 'yazdığın: “' + w.given + '”' : 'boş bırakıldı'}</div></div>`).join('');
    panel.innerHTML = `<div class="quiz-end"><div class="fc-pos">SONUÇ</div><div class="quiz-score">${typeState.correct} / ${typeState.order.length}</div><div class="fc-example">Yazarak hatırlamak en kalıcı yöntemdir.</div><div class="fc-controls" style="margin-top:20px;"><button class="btn primary" id="typeAgain">Tekrar Dene</button></div></div>${typeState.wrong.length ? `<div class="review-section"><div class="review-title">Yanlış / Eksik Yazılanlar (${typeState.wrong.length})</div>${wrongList}</div>` : `<div class="review-section"><div class="review-title" style="color:var(--sage);">Hepsini doğru yazdın 🎉</div></div>`}`;
    document.getElementById('typeAgain').onclick = ()=>{ typeState = null; renderType(); };
    return;
  }
  const w = typeState.order[typeState.index];
  panel.innerHTML = `
    <div class="type-meta"><span>SORU ${typeState.index+1} / ${typeState.order.length}</span><span>DOĞRU: ${typeState.correct}</span></div>
    <div class="type-prompt"><div class="type-tr">${w.tr}</div><div class="type-example">${w.ex.split('___')[0]}<span class="type-blank">______</span>${w.ex.split('___')[1]}</div></div>
    <div class="type-row"><input class="type-input mono" id="typeInput" placeholder="İngilizcesini yaz" autocomplete="off" spellcheck="false"><button class="btn primary" id="typeCheck">Kontrol Et</button></div>
    <div class="type-feedback" id="typeFeedback"></div>
  `;
  const input = document.getElementById('typeInput');
  input.focus();
  const check = ()=>{
    if(typeState.checked) return;
    typeState.checked = true;
    const val = input.value.trim().toLowerCase();
    const success = val === w.en.toLowerCase();
    input.classList.add(success ? 'correct' : 'incorrect');
    input.disabled = true;
    if(success) typeState.correct++; else typeState.wrong.push({...w, given: val});
    bumpMastery(w.en, success);
    document.getElementById('typeFeedback').textContent = success ? 'Doğru!' : `Doğrusu: "${w.en}"`;
    setTimeout(()=>{ typeState.index++; typeState.checked = false; renderType(); }, 1400);
  };
  document.getElementById('typeCheck').onclick = check;
  input.addEventListener('keydown', e=>{ if(e.key === 'Enter') check(); });
}

// 🌟 Tüm Kelimeleri Seçme Fonksiyonu
function selectAllWords() {
  // Tüm kelimeleri al ve karıştır (limit yok)
  const karisik = shuffle([...ALL_WORDS]);
  WORDS = karisik;
  
  // Başlık ve alt başlığı tüm kelime sayısına göre güncelle
  document.getElementById('eyebrowLabel').textContent = WORDS.length + ' kart · sözcük çekmecesi';
  document.getElementById('subLabel').textContent = 'Tüm kelimeler devrede! Kartları çevir, eşleştir, sına — ' + WORDS.length + ' kelimeyi hafızaya kazı.';

  // Ustalık ve oyun durumlarını sıfırla
  mastery = {};
  WORDS.forEach(w => mastery[w.en] = 'new');

  storyState = { text:null, title:null, loading:false, error:null, usedWords:[] };
  srsState = null;
  typeState = null;

  // Ekranı yeni duruma göre çiz
  renderProgress();
  const aktifTab = document.querySelector('nav.tabs button.active');
  if(aktifTab) render(aktifTab.dataset.tab);
}

// 🎯 Odaklı Yazma Fonksiyonu
async function renderFocusedType() {
  // Veriler gelene kadar ekrana yükleme animasyonu çiz
  panel.innerHTML = `
    <div class="fc-pos">BULUTTAN EN ÇOK HATA YAPTIĞIN KELİMELER ANALİZ EDİLİYOR...</div>
    <div style="text-align:center; padding:20px; font-size:24px;">⏳</div>
  `;
  
  try {
    const snapshot = await db.collection('userStats').doc(userCode).collection('words').get();
    let stats = [];
    
    snapshot.forEach(doc => {
      let data = doc.data();
      let wordObj = ALL_WORDS.find(w => w.en === data.en);
      if(wordObj && data.yanlis > 0) {
        stats.push({ ...wordObj, yanlis: data.yanlis });
      }
    });
    
    // Eğer hiç yanlış yapılan kelime yoksa tatlı bir mesaj göster
    if (stats.length === 0) {
      panel.innerHTML = `
        <div class="fc-pos" style="color:var(--sage);">HARİKA HABER!</div>
        <div class="fc-example" style="margin-top:20px;">Bulutta henüz hiç hatalı kelimen yok. Normal yazma alıştırmasına veya diğer modlara geçebilirsin! 🎉</div>
      `;
      return;
    }
    
    // En çok hata yapılanları sırala ve ilk 10'unu al
    stats.sort((a,b) => b.yanlis - a.yanlis);
    const top10 = stats.slice(0, 10);
    
    // Kelime havuzunu geçici olarak bu 10 kelimeyle sınırla ve karıştır
    WORDS = shuffle(top10);
    
    // Üst bilgileri güncelle
    document.getElementById('eyebrowLabel').textContent = WORDS.length + ' odaklı kart · sözcük çekmecesi';
    document.getElementById('subLabel').textContent = '🎯 En çok zorlandığın ' + WORDS.length + ' kelimeyi yazarak hafızaya kazı.';
    
    mastery = {};
    WORDS.forEach(w => mastery[w.en] = 'new');
    renderProgress();
    
    // Yazma alıştırmasının state'ini sıfırla ve asıl yazma ekranını çiz
    typeState = null; 
    renderType();
    
  } catch (error) {
    console.error(error);
    panel.innerHTML = `<div class="fc-pos" style="color:var(--stamp-dark)">HATA OLUŞTU</div><div class="fc-example">Veriler çekilemedi. İnternet bağlantını kontrol et.</div>`;
  }
}
